name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test --no-build -c Release
          --filter "FullyQualifiedName!~IntegrationTests"
          $(git ls-files 'tests/UnitTests/**/*.csproj' 'tests/ArchitectureTests/**/*.csproj')
          --logger "trx" --results-directory ./test-results

      # Modules are scaffolded with the Testcontainers harness wired but no integration
      # test bodies yet (see tests/IntegrationTests/README.md). continue-on-error stays
      # on until a module adds its first real integration test.
      - name: Integration tests (Testcontainers — requires Docker, provided by the runner)
        run: >
          dotnet test --no-build -c Release
          $(git ls-files 'tests/IntegrationTests/**/*.csproj')
          --logger "trx" --results-directory ./test-results
        continue-on-error: true

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./test-results

  frontend:
    name: Frontend (pnpm workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Lint
        run: pnpm -r lint
        continue-on-error: true

      - name: Unit tests
        run: pnpm test

      - name: Build apps
        run: pnpm -r build

  docker-images:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: false
          tags: speeded-erp/api:ci

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          push: false
          tags: speeded-erp/worker:ci

      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          push: false
          tags: speeded-erp/gateway:ci

  k8s-manifests:
    name: Validate Kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build (base + every overlay)
        run: |
          set -euo pipefail
          for overlay in base overlays/dev overlays/staging overlays/prod overlays/saas overlays/onprem; do
            echo "== $overlay =="
            kubectl kustomize "deploy/k8s/$overlay" > /dev/null
          done
