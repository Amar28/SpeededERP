apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SaaS target (architecture section 30, Fig. 04 legend): app.monerp.com, shared
# multi-tenant database with Row-Level Security (section 17 "Shared" isolation),
# aggressive autoscaling since load is the sum of every subscribed tenant.
namespace: speeded-erp-saas

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: speeded-erp-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: speeded-erp-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 30
      - op: add
        path: /spec/metrics/-
        value:
          type: Resource
          resource:
            name: memory
            target:
              type: Utilization
              averageUtilization: 75
  - target:
      kind: Ingress
      name: speeded-erp-gateway
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.monerp.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.monerp.com
      - op: replace
        path: /spec/tls/0/secretName
        value: speeded-erp-saas-tls
  - target:
      kind: ConfigMap
      name: speeded-erp-config
    patch: |-
      - op: replace
        path: /data/ASPNETCORE_ENVIRONMENT
        value: Production
      - op: add
        path: /data/MultiTenancy__DefaultIsolationMode
        value: Shared

images:
  - name: speeded-erp/api
    newTag: latest
  - name: speeded-erp/worker
    newTag: latest
  - name: speeded-erp/gateway
    newTag: latest
