apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: speeded-erp-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: speeded-erp-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  - target:
      kind: Deployment
      name: speeded-erp-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
  - target:
      kind: HorizontalPodAutoscaler
      name: speeded-erp-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
  - target:
      kind: Ingress
      name: speeded-erp-gateway
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: erp.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: erp.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: speeded-erp-prod-tls
  - target:
      kind: ConfigMap
      name: speeded-erp-config
    patch: |-
      - op: replace
        path: /data/ASPNETCORE_ENVIRONMENT
        value: Production

images:
  - name: speeded-erp/api
    newTag: latest
  - name: speeded-erp/worker
    newTag: latest
  - name: speeded-erp/gateway
    newTag: latest

# Same secret-management note as overlays/staging — base/secret.yaml is a local-dev
# placeholder only. Production MUST inject real secrets through your platform's
# secret manager, never through this repo.
