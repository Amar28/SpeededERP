apiVersion: apps/v1
kind: Deployment
metadata:
  name: speeded-erp-gateway
  namespace: speeded-erp
  labels:
    app.kubernetes.io/name: speeded-erp-gateway
    app.kubernetes.io/part-of: speeded-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: speeded-erp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speeded-erp-gateway
        app.kubernetes.io/part-of: speeded-erp
    spec:
      containers:
        - name: gateway
          image: speeded-erp/gateway:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: speeded-erp-gateway
  namespace: speeded-erp
  labels:
    app.kubernetes.io/name: speeded-erp-gateway
spec:
  selector:
    app.kubernetes.io/name: speeded-erp-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
