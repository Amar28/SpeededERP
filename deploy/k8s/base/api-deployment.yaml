apiVersion: apps/v1
kind: Deployment
metadata:
  name: speeded-erp-api
  namespace: speeded-erp
  labels:
    app.kubernetes.io/name: speeded-erp-api
    app.kubernetes.io/part-of: speeded-erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: speeded-erp-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speeded-erp-api
        app.kubernetes.io/part-of: speeded-erp
    spec:
      containers:
        - name: api
          image: speeded-erp/api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: speeded-erp-config
            - secretRef:
                name: speeded-erp-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: speeded-erp-api
  namespace: speeded-erp
  labels:
    app.kubernetes.io/name: speeded-erp-api
spec:
  selector:
    app.kubernetes.io/name: speeded-erp-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: speeded-erp-api
  namespace: speeded-erp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: speeded-erp-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
