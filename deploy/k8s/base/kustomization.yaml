apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: speeded-erp

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - gateway-deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: speeded-erp
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
